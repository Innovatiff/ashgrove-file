name: Deploy to Firebase

# Deploys the whole site, the main website and The Ashgrove File, to the
# Firebase project named in .firebaserc.
#
# It runs only when someone starts it:
#   Actions tab -> Deploy to Firebase -> Run workflow
#
# One-time setup is in README.md, under "Deploy from GitHub". It needs one
# repository secret:
#   FIREBASE_SERVICE_ACCOUNT   a service account key that is allowed to deploy
#
# The answers come from answers.sealed.json in the repository, which only that
# key can open. A secret named ANSWERS_JSON is read as a fallback when there
# is no sealed file the key can open.
#
# To test the setup without deploying anything, run "Check deploy setup"
# (check.yml) instead.

on:
  workflow_dispatch:
    inputs:
      rules:
        description: Firestore rules and indexes
        type: boolean
        default: true
      functions:
        description: Cloud Functions
        type: boolean
        default: true
      seed:
        description: Seed answers and room content
        type: boolean
        default: true
      hosting:
        description: The website (Firebase Hosting)
        type: boolean
        default: true

permissions:
  contents: read

# Two deploys never run at once. A second one waits for the first.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ashgrove-file.web.app

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Stops here, before anything is deployed, if the key is missing or
      # cannot be read, or the sealed answers do not open with it. A key
      # damaged in the copy is repaired when it can be.
      - name: Put the key and the answers in place
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANSWERS_JSON: ${{ secrets.ANSWERS_JSON }}
          WANT_SEED: ${{ inputs.seed }}
        run: node scripts/ci-credentials.mjs

      # Read-only. Stops only on what would make this deploy fail: a key
      # Google does not accept, or functions on a project that is not on
      # Blaze. Anything else it finds is reported and the deploy goes on.
      - name: Ask Google whether the project is ready
        env:
          WANT_FUNCTIONS: ${{ inputs.functions }}
        run: node scripts/ci-preflight.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Check the code
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit

      # The seed's own validation, with nothing written. An answers file that
      # does not fit the rooms stops the run before anything goes live.
      - name: Check the answers against the rooms
        if: inputs.seed
        run: npm run seed:prod -- --dry-run

      # Order matters: the rules and the functions go live before the site
      # that depends on them.
      - name: Deploy Firestore rules and indexes
        if: inputs.rules
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive

      - name: Deploy Cloud Functions
        if: inputs.functions
        run: npx firebase deploy --only functions --non-interactive --force

      - name: Seed answers and room content
        if: inputs.seed
        run: npm run seed:prod -- --yes

      # The predeploy hook in firebase.json builds the site and runs the
      # bundle check first, so a leaking build is never uploaded.
      - name: Deploy the website
        if: inputs.hosting
        run: npx firebase deploy --only hosting --non-interactive

      - name: Remove the secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" answers.json
