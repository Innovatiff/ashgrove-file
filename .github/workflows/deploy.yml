name: Deploy to Firebase

# Deploys The Ashgrove File to the Firebase project named in .firebaserc.
#
# It runs only when someone starts it:
#   Actions tab -> Deploy to Firebase -> Run workflow
#
# One-time setup is in README.md, under "Deploy from GitHub". It needs two
# repository secrets:
#   FIREBASE_SERVICE_ACCOUNT   a service account key that is allowed to deploy
#   ANSWERS_JSON               the contents of answers.json (needed to seed)

on:
  workflow_dispatch:
    inputs:
      rules:
        description: Firestore rules and indexes
        type: boolean
        default: true
      functions:
        description: Cloud Functions
        type: boolean
        default: true
      seed:
        description: Seed answers and room content
        type: boolean
        default: true
      hosting:
        description: The website (Firebase Hosting)
        type: boolean
        default: true

permissions:
  contents: read

# Two deploys never run at once. A second one waits for the first.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ashgrove-file.web.app

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Stops here, before anything is deployed, if a secret is missing.
      - name: Put the secrets in place
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANSWERS_JSON: ${{ secrets.ANSWERS_JSON }}
          WANT_SEED: ${{ inputs.seed }}
        run: node scripts/ci-credentials.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Check the code
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit

      # Order matters: the rules and the functions go live before the site
      # that depends on them.
      - name: Deploy Firestore rules and indexes
        if: inputs.rules
        run: npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive

      - name: Deploy Cloud Functions
        if: inputs.functions
        run: npx firebase deploy --only functions --non-interactive --force

      - name: Seed answers and room content
        if: inputs.seed
        run: npm run seed:prod -- --yes

      # The predeploy hook in firebase.json builds the site and runs the
      # bundle check first, so a leaking build is never uploaded.
      - name: Deploy the website
        if: inputs.hosting
        run: npx firebase deploy --only hosting --non-interactive

      - name: Remove the secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" answers.json
